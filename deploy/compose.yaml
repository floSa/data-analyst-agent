# Le service de l'application. Se lance par `deploy/daactl start`, ou par
# l'unité systemd `deploy/daa.service` qui appelle la même chose au démarrage
# de la machine.
#
# AUCUN secret ici : le fichier ne porte que des noms de variables. Leurs
# valeurs — mot de passe Postgres, clé d'API du moteur — vivent dans le fichier
# d'environnement en 0600 désigné par DAA_ENV_FILE (défaut :
# /etc/data-analyst-agent/daa.env), hors du dépôt. Le compose le lit deux fois,
# et c'est voulu : `--env-file` sur la ligne de commande pour interpoler les
# ${...} ci-dessous, `env_file:` ci-dessous pour les poser dans le conteneur.

name: data-analyst-agent

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: data-analyst-agent:0.1
    restart: unless-stopped

    env_file:
      - ${DAA_ENV_FILE:-/etc/data-analyst-agent/daa.env}

    # 127.0.0.1, et ça le reste : ce qui expose, c'est le service `proxy`
    # ci-dessous. Ce port-ci n'existe plus que pour la sonde et le diagnostic
    # depuis la machine — `curl http://127.0.0.1:8000/health` sans traverser
    # TLS. L'ouvrir (DAA_HTTP_BIND=0.0.0.0) publierait l'application en clair À
    # CÔTÉ du mandataire, et rendrait tout le reste décoratif.
    ports:
      - "${DAA_HTTP_BIND:-127.0.0.1}:${DAA_HTTP_PORT:-8000}:8000"

    # Les mandataires dont l'application croit les en-têtes. Par défaut le
    # réseau du compose, et RIEN d'autre : c'est là, et seulement là, que vit le
    # mandataire ci-dessous. Une valeur plus large — « tout le privé » — rendrait
    # l'anti-force brute contournable par quiconque atteindrait le port 8000.
    environment:
      DAA_TRUSTED_PROXIES: ${DAA_TRUSTED_PROXIES:-${DAA_NETWORK_SUBNET:-172.30.0.0/24}}

    # LE point délicat, et la raison pour laquelle il n'y a qu'UN volume.
    #
    # L'application ne calcule pas dans son propre conteneur : elle lance un
    # conteneur FRÈRE (le bac à sable) et lui monte des fichiers. Ces montages
    # sont interprétés par le démon de l'hôte, donc les chemins qu'elle lui
    # donne doivent exister SUR L'HÔTE, à l'identique. Un dossier monté ailleurs
    # dans le conteneur que là où il est sur l'hôte donnerait un `docker run`
    # avec un chemin qui n'existe nulle part — et un bac à sable vide.
    #
    # D'où la règle : un seul dossier de données, monté au MÊME chemin absolu
    # des deux côtés, et tout ce qui peut finir dans un montage vit dedans —
    # les conversations (DAA_WORKSPACE_DIR), les fichiers des sources
    # (DAA_CATALOG_PATH), et les CSV temporaires des tables SQL matérialisées
    # (TMPDIR, sans quoi ils tomberaient dans le /tmp du conteneur).
    volumes:
      - ${DAA_DATA_DIR:?DAA_DATA_DIR manquant}:${DAA_DATA_DIR:?}
      # La socket du démon : c'est par elle que le bac à sable est lancé.
      # Ce que cela donne, et pourquoi c'est tenable, est écrit noir sur blanc
      # dans docs/INSTALLATION.md §« Le bac à sable vu du conteneur ».
      - /var/run/docker.sock:/var/run/docker.sock

    # Le conteneur tourne en 1000:1000 (cf. Dockerfile). `group_add` lui ajoute
    # le groupe propriétaire de la socket, dont le gid dépend de la machine :
    # `stat -c %g /var/run/docker.sock`.
    group_add:
      - "${DAA_DOCKER_GID:?DAA_DOCKER_GID manquant — stat -c %g /var/run/docker.sock}"

    # Le moteur LLM et Postgres tournent SUR L'HÔTE, pas dans ce compose : le
    # moteur est un service partagé (dépôt llm-service) qu'on ne relance pas
    # ici. `host-gateway` donne au conteneur un nom pour joindre son hôte, ce
    # que `localhost` ne fait pas depuis un conteneur.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Journaux bornés : sans cela, un fichier json grossit jusqu'à remplir le
    # disque, et un service qui tombe faute de place est un service qu'on n'a
    # pas livré.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # LA TERMINAISON TLS. C'est elle, et elle seule, qui est joignable depuis
  # l'extérieur de la machine.
  #
  # Dans le MÊME compose que l'application, et non à côté : les deux tombent et
  # reviennent ensemble, une seule unité systemd les commande, et `app` n'a
  # besoin d'aucun port publié pour être atteinte — le mandataire la joint par
  # le réseau du projet, sous son nom de service.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

    # Le port exposé. 8443 par défaut et non 443, parce que la machine héberge
    # d'autres services et qu'un port privilégié est une ressource qu'on ne
    # s'attribue pas en silence : DAA_HTTPS_PORT=443 est une décision qui se
    # prend, pas un défaut qu'on subit.
    ports:
      - "${DAA_HTTPS_BIND:-0.0.0.0}:${DAA_HTTPS_PORT:-8443}:443"
      - "${DAA_HTTPS_BIND:-0.0.0.0}:${DAA_HTTP_REDIRECT_PORT:-8080}:80"

    volumes:
      # Le gabarit de configuration. L'entrée de l'image le passe dans
      # `envsubst` et écrit /etc/nginx/conf.d/default.conf.
      - ./proxy:/etc/nginx/templates:ro
      # Le certificat et sa clé, HORS DU DÉPÔT (cf. tls-cert.sh). En lecture
      # seule : le mandataire n'a aucune raison d'y écrire.
      - ${DAA_TLS_DIR:-/etc/data-analyst-agent/tls}:/etc/nginx/tls:ro

    environment:
      # Limite la substitution aux variables de ce projet : sans ce filtre,
      # `envsubst` remplacerait aussi tout $NOM du gabarit qui se trouverait
      # exister dans l'environnement du conteneur.
      NGINX_ENVSUBST_FILTER: "^DAA_"
      # Lue par le gabarit, pour la cible de la redirection http -> https.
      DAA_HTTPS_PORT: ${DAA_HTTPS_PORT:-8443}

    healthcheck:
      # On interroge la sonde de l'application À TRAVERS TLS : c'est la chaîne
      # entière qu'on veut voir verte, pas nginx tout seul.
      # `--no-check-certificate` parce que le certificat est signé par une
      # autorité locale, et que la sonde n'a pas à connaître le magasin de
      # confiance des postes.
      #
      # `-O /dev/null` et NON `--spider` : le spider ferme la connexion avant la
      # fin du corps, nginx reçoit un SIGPIPE et écrit un « [alert] unknown
      # process exited on signal 13 » — toutes les quinze secondes. Un journal
      # qui crie sans raison est un journal qu'on cesse de lire.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=4",
             "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # L'image du bac à sable. Ce service ne DÉMARRE jamais : il n'est là que pour
  # que `docker compose --profile outils build sandbox` sache la construire à
  # partir du contexte qui existe déjà, celui-là même que la CI construit. Le
  # profil l'écarte de `up`.
  sandbox:
    profiles: ["outils"]
    image: ${DAA_SANDBOX_IMAGE:-data-analyst-agent-sandbox:0.1}
    build:
      context: ../src/data_analyst_agent/sandbox/image
    command: ["/bin/true"]

# Le sous-réseau est FIXÉ, et ce n'est pas de la coquetterie : `app` ne croit
# `X-Forwarded-For` que des adresses déclarées dans DAA_TRUSTED_PROXIES, et un
# sous-réseau que Docker attribue au hasard rendrait cette déclaration
# invérifiable — donc fausse un jour, en silence, avec pour seul symptôme un
# anti-force brute qui compte tout le monde sur une seule adresse.
#
# À changer si 172.30.0.0/24 est déjà pris sur la machine
# (`docker network inspect`) : DAA_NETWORK_SUBNET suffit, DAA_TRUSTED_PROXIES
# suit tout seul.
networks:
  default:
    ipam:
      config:
        - subnet: ${DAA_NETWORK_SUBNET:-172.30.0.0/24}
