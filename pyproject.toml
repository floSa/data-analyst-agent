[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Agent conversationnel sur données (on-premise) : requêtes SQL, auto-stats et visualisations en sandbox, inférence ML gardée"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Hachage des mots de passe en argon2id : lent et à mémoire dure, là où un
    # sha256 s'essaie par milliards par seconde sur un GPU. Implémentation de
    # référence (liaison sur libargon2), pas de réécriture maison.
    "argon2-cffi>=25.1.0",
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    "joblib>=1.5.3",
    "langgraph>=1.2.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pg8000>=1.31.5",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[openai]>=2.7.0",
    "pydantic-settings>=2.14.2",
    # Lecture des formulaires (multipart/urlencoded) par FastAPI : la page de
    # connexion est un formulaire HTML ordinaire, sans une ligne de JavaScript.
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # parseur JS (BSD) : valide le script de la page de chat, servie comme une
    # chaîne Python où un échappement raté casserait tout le script sans bruit.
    "esprima>=4.0.1",
    "jupytext>=1.19.4",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
    # Version bornée au patch près : ruff 0.16 formate les blocs de code des
    # fichiers Markdown, 0.15 refuse de le faire. Une borne large laissait la CI
    # (dernière version) contredire le hook pre-commit (version épinglée).
    "ruff>=0.16.1,<0.17",
    "testcontainers[postgres]>=4.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle — erreurs
    "W",   # pycodestyle — warnings
    "F",   # pyflakes
    "I",   # isort — tri des imports
    "UP",  # pyupgrade — syntaxe moderne
    "B",   # bugbear — pièges courants
    "SIM", # simplifications
    "C4",  # compréhensions
    "PT",  # style pytest
    "RUF", # règles spécifiques ruff
]

[tool.coverage.run]
# bridge.py s'exécute DANS le conteneur sandbox : couvert par les tests
# d'intégration à travers le protocole, invisible pour coverage côté hôte.
omit = ["*/sandbox/image/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "-m 'not live and not ui' --strict-markers --cov=data_analyst_agent --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: tests d'intégration (Docker, testcontainers, sandbox réelle)",
    "e2e: scénarios golden de bout en bout",
    "live: nécessite le LLM local, exclu par défaut et en CI",
    # La fixture `playwright` est de portée session : sa boucle d'événements
    # reste active toute la session et fait échouer chaque run_sync de
    # pydantic-ai qui suit (« This event loop is already running »). D'où un
    # processus pytest séparé : `uv run pytest -m ui`.
    "ui: page de chat pilotée dans un navigateur (Playwright, processus séparé)",
]
filterwarnings = [
    # libs tierces, rien à corriger chez nous :
    # pydantic-graph appelle asyncio.get_event_loop() (déprécié py3.12)
    "ignore:There is no current event loop:DeprecationWarning",
    # joblib assigne .shape au chargement des pickles (déprécié NumPy 2.5)
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
