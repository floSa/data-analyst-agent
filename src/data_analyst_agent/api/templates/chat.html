<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data-analyst-agent</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: flex; height: 100vh; overflow: hidden; }
  /* barre latérale : nouvelle conversation + fils précédents */
  #barre { width: 16rem; flex: none; display: flex; flex-direction: column;
           gap: .5rem; padding: 1rem .75rem; border-right: 1px solid #6b728055;
           background: #6b728011; overflow-y: auto; }
  #nouvelle { width: 100%; }
  #fils { display: flex; flex-direction: column; gap: .15rem; }
  .fil { display: flex; align-items: center; gap: .25rem; border-radius: .4rem; }
  .fil:hover, .fil.actif { background: #2563eb22; }
  .fil-titre { flex: 1; min-width: 0; padding: .45rem .5rem; background: none;
               border: 0; color: inherit; font-size: .85rem; text-align: left;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               cursor: pointer; }
  .fil-action { flex: none; padding: .25rem .35rem; background: none; border: 0;
                color: inherit; opacity: 0; cursor: pointer; font-size: .8rem; }
  .fil:hover .fil-action, .fil:focus-within .fil-action { opacity: .7; }
  .fil-action:hover { opacity: 1; }
  .vide { font-size: .8rem; opacity: .6; padding: .5rem; }
  /* pied de barre : qui est connecté, et par où sortir */
  #compte { margin-top: auto; padding-top: .5rem; border-top: 1px solid #6b728055;
            display: flex; align-items: center; gap: .5rem; font-size: .8rem; }
  #login { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; opacity: .8; }
  #deconnexion { flex: none; padding: .3rem .6rem; font-size: .8rem;
                 background: none; border: 1px solid #6b7280; color: inherit; }
  /* colonne de chat */
  #colonne { flex: 1; display: flex; flex-direction: column; min-width: 0;
             max-width: 860px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.2rem; margin-bottom: .5rem; }
  /* l'indicateur de source de travail : permanent, au-dessus du fil */
  #source-de-travail { display: flex; align-items: baseline; gap: .5rem;
                       flex-wrap: wrap; padding: .5rem .75rem; margin-bottom: .75rem;
                       border: 1px solid #6b728055; border-radius: .5rem;
                       background: #6b728011; font-size: .85rem; }
  #source-de-travail label { opacity: .75; }
  #source-liee { font-weight: 600; padding: .3rem .4rem; border-radius: .3rem;
                     border: 1px solid #6b7280; background: transparent;
                     color: inherit; font-size: .85rem; max-width: 20rem; }
  #faits-de-source { flex-basis: 100%; opacity: .7; font-size: .8rem; }
  #journal { flex: 1; overflow-y: auto; display: flex; flex-direction: column;
             gap: .75rem; margin-bottom: 1rem; }
  .message { padding: .6rem .9rem; border-radius: .6rem; white-space: pre-wrap;
             max-width: 80%; }
  .utilisateur { background: #2563eb22; align-self: flex-end; }
  .agent { background: #6b728022; align-self: flex-start; }
  .agent { white-space: normal; }
  .agent p { margin: .35rem 0; }
  .agent p:first-child { margin-top: 0; }
  .agent p:last-child { margin-bottom: 0; }
  .agent ul { margin: .35rem 0; padding-left: 1.2rem; }
  .agent li { margin: .1rem 0; }
  .agent h4 { margin: .6rem 0 .25rem; font-size: 1rem; }
  .agent code { background: #6b728033; padding: .05rem .25rem;
                border-radius: .25rem; font-size: .9em; }
  .agent img { max-width: 100%; border-radius: .4rem; margin-top: .5rem; }
  .agent table { border-collapse: collapse; margin-top: .5rem; font-size: .85rem; }
  .agent td, .agent th { border: 1px solid #6b7280; padding: .2rem .5rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .6rem; border-radius: .4rem; border: 1px solid #6b7280; }
  button { padding: .6rem 1.2rem; border-radius: .4rem; border: 0;
           background: #2563eb; color: white; cursor: pointer; }
  button:disabled { opacity: .5; }
  .erreur { color: #dc2626; }
  .reflexion { display: flex; align-items: center; gap: .5rem;
               font-style: italic; opacity: .8; }
  .roue { width: 1.1em; height: 1.1em; border-radius: 50%;
          border: 2px solid #6b7280; border-top-color: transparent;
          animation: rotation .8s linear infinite; flex: none; }
  @keyframes rotation { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<nav id="barre">
  <button id="nouvelle" type="button">+ Nouvelle conversation</button>
  <div id="fils"></div>
  <div id="compte">
    <span id="login" title="{{login}}">{{login}}</span>
    <button id="deconnexion" type="button">Se déconnecter</button>
  </div>
</nav>
<main id="colonne">
  <h1>data-analyst-agent</h1>
  <!-- La source de travail : un TÉMOIN, pas une commande. On la choisit en
       PARLANT — « quelles sources as-tu ? », « travaille sur exploitation » —
       et ce bandeau ne fait que dire laquelle le fil porte. Un menu était monté
       ici ; il proposait à l'ouverture un choix que personne n'avait demandé, et
       il laissait croire qu'il fallait le faire avant de parler. C'est l'inverse
       du produit : l'agent annonce ses sources et lie celle qu'on lui nomme.
       L'API `PUT /conversations/<id>/source` reste, elle sert au verrou. -->
  <div id="source-de-travail">
    <label>Source de travail</label>
    <span id="source-liee"></span>
    <span id="faits-de-source"></span>
  </div>
  <div id="journal"></div>
  <form id="formulaire">
    <input type="text" id="message" autocomplete="off"
           placeholder="Pose ta question sur les données...">
    <button type="submit" id="envoyer">Envoyer</button>
  </form>
</main>
<script>
// Toutes les requêtes passent par `appel` : c'est là que le jeton anti-CSRF est
// ajouté aux méthodes qui modifient l'état, et là qu'une session expirée renvoie
// à la page de connexion. Le cookie de session part tout seul, y compris sur une
// requête déclenchée par un autre site — le jeton, lui, ne se devine pas depuis
// une autre origine.
const COOKIE_CSRF = "{{cookie_csrf}}";

function jetonCsrf() {
  const trouve = document.cookie.match(new RegExp("(?:^|; )" + COOKIE_CSRF + "=([^;]*)"));
  return trouve ? decodeURIComponent(trouve[1]) : "";
}

async function appel(url, options) {
  const parametres = Object.assign({}, options);
  const methode = parametres.method || "GET";
  if (methode !== "GET") {
    parametres.headers = Object.assign({"X-CSRF-Token": jetonCsrf()}, parametres.headers);
  }
  const reponse = await fetch(url, parametres);
  if (reponse.status === 401) {
    // Session expirée ou révoquée : la page ne peut rien faire de plus utile
    // que de rendre la main au formulaire de connexion.
    location.href = "/login";
    throw new Error("session expirée");
  }
  return reponse;
}

const journal = document.getElementById("journal");
const formulaire = document.getElementById("formulaire");
const champ = document.getElementById("message");
const bouton = document.getElementById("envoyer");
const fils = document.getElementById("fils");
const sourceLiee = document.getElementById("source-liee");
const faitsDeSource = document.getElementById("faits-de-source");
// null = conversation neuve : le serveur lui attribuera un id au 1er message.
let conversationId = null;
// Le catalogue, tel que /sources le rend : nom, type, description, et les faits
// LUS dans chaque source (tables, lignes, période). Chargé une fois.
let sources = [];

// Ce que dit l'indicateur quand rien n'est choisi. Ce n'est pas un manque :
// c'est l'état normal d'un fil neuf, et il annonce ce que l'agent fera.
const AUCUNE_SOURCE = "— aucune (demande-la-moi)";

function bulle(classe) {
  const div = document.createElement("div");
  div.className = "message " + classe;
  journal.appendChild(div);
  return div;
}

function rendreTable(bloc, data) {
  const table = document.createElement("table");
  const entete = table.insertRow();
  data.columns.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c;
    entete.appendChild(th);
  });
  data.rows.slice(0, 20).forEach(ligne => {
    const tr = table.insertRow();
    ligne.forEach(v => { tr.insertCell().textContent = v === null ? "" : v; });
  });
  bloc.appendChild(table);
}

// Même rendu pour un tour qui arrive et pour un tour relu d'une conversation
// rouverte. Les paramètres sont explicites À DESSEIN : les deux sources ne
// portent pas le même nom de champ (`answer` pour /chat, `content` pour un
// message relu de /conversations). Prendre l'objet entier faisait lire un
// `corps.answer` inexistant à la relecture — toutes les réponses rouvertes
// s'affichaient « (pas de réponse) », tableaux corrects à côté.
function rendreReponse(bloc, texte, artefacts, erreur) {
  bloc.classList.remove("reflexion");
  bloc.innerHTML = enHtml(texte || "(pas de réponse)");
  if (erreur) {
    const p = document.createElement("p");
    p.className = "erreur";
    p.textContent = erreur;
    bloc.appendChild(p);
  }
  for (const artefact of artefacts || []) {
    if (artefact.mime === "image/png") {
      const img = document.createElement("img");
      img.src = "data:image/png;base64," + artefact.data;
      bloc.appendChild(img);
    } else if (artefact.mime === "application/json") {
      try { rendreTable(bloc, JSON.parse(artefact.data)); } catch (e) {}
    }
  }
}

// --- markdown minimal -------------------------------------------------------
// Le LLM répond en markdown (**gras**, puces, `code`) et on n'a droit à aucune
// bibliothèque externe (on-prem, réseau coupé, zéro CDN). D'où ce rendu à la
// main, volontairement réduit à ce que le modèle produit vraiment.
//
// SÉCURITÉ : on échappe TOUT d'abord, puis on ne réintroduit que nos propres
// balises. Le texte vient d'un LLM, lui-même nourri de données : une réponse
// contenant "<img onerror=...>" doit s'afficher, jamais s'exécuter.

function echapper(texte) {
  return texte.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function enligne(texte) {
  return texte
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function enHtml(texte) {
  const sortie = [];
  let liste = false;
  for (const ligne of echapper(texte).split("\n")) {
    const puce = ligne.match(/^\s*[*-]\s+(.*)$/);
    if (puce) {
      if (!liste) { sortie.push("<ul>"); liste = true; }
      sortie.push("<li>" + enligne(puce[1]) + "</li>");
      continue;
    }
    if (liste) { sortie.push("</ul>"); liste = false; }
    const titre = ligne.match(/^#{1,6}\s+(.*)$/);
    if (titre) { sortie.push("<h4>" + enligne(titre[1]) + "</h4>"); continue; }
    if (ligne.trim()) sortie.push("<p>" + enligne(ligne) + "</p>");
  }
  if (liste) sortie.push("</ul>");
  return sortie.join("");
}

function defiler() { journal.scrollTop = journal.scrollHeight; }

// --- l'indicateur de source de travail --------------------------------------

async function chargerLesSources() {
  const reponse = await appel("/sources");
  sources = await reponse.json();
}

// Affiche l'état SANS le renvoyer au serveur : appelée après chaque réponse et
// à l'ouverture d'un fil, c'est-à-dire à chaque fois que la source a pu changer
// du fait de l'agent (bascule annoncée) et non de ce menu.
function afficherLaSource(nom) {
  const source = sources.find(s => s.name === nom);
  sourceLiee.dataset.nom = nom || "";
  sourceLiee.textContent = nom || AUCUNE_SOURCE;
  faitsDeSource.textContent = source ? (source.faits || source.description) : "";
}

async function rafraichirFils() {
  const reponse = await appel("/conversations");
  const liste = await reponse.json();
  fils.textContent = "";
  if (!liste.length) {
    const vide = document.createElement("p");
    vide.className = "vide";
    vide.textContent = "Aucune conversation.";
    fils.appendChild(vide);
    return;
  }
  for (const resume of liste) {
    const ligne = document.createElement("div");
    ligne.className = "fil" + (resume.id === conversationId ? " actif" : "");

    const titre = document.createElement("button");
    titre.type = "button";
    titre.className = "fil-titre";
    titre.textContent = resume.title;
    titre.title = resume.title;
    titre.addEventListener("click", () => ouvrir(resume.id));

    const dupliquer = document.createElement("button");
    dupliquer.type = "button";
    dupliquer.className = "fil-action";
    dupliquer.textContent = "⧉";
    dupliquer.title = "Dupliquer";
    dupliquer.addEventListener("click", async () => {
      const reponse = await appel("/conversations/" + resume.id + "/duplicate",
                                  {method: "POST"});
      if (reponse.ok) { ouvrir((await reponse.json()).id); }
    });

    const supprimer = document.createElement("button");
    supprimer.type = "button";
    supprimer.className = "fil-action";
    supprimer.textContent = "✕";
    supprimer.title = "Supprimer";
    supprimer.addEventListener("click", async () => {
      if (!confirm("Supprimer « " + resume.title + " » ?")) return;
      await appel("/conversations/" + resume.id, {method: "DELETE"});
      if (resume.id === conversationId) nouvelleConversation();
      else rafraichirFils();
    });

    ligne.append(titre, dupliquer, supprimer);
    fils.appendChild(ligne);
  }
}

async function ouvrir(id) {
  const reponse = await appel("/conversations/" + id);
  if (!reponse.ok) { rafraichirFils(); return; }
  const conversation = await reponse.json();
  conversationId = conversation.id;
  afficherLaSource(conversation.source_de_travail);
  journal.textContent = "";
  for (const message of conversation.messages) {
    if (message.role === "user") bulle("utilisateur").textContent = message.content;
    else rendreReponse(bulle("agent"), message.content, message.artifacts, message.error);
  }
  await rafraichirFils();
  defiler();
  champ.focus();
}

function nouvelleConversation() {
  conversationId = null;
  afficherLaSource("");
  journal.textContent = "";
  rafraichirFils();
  champ.focus();
}

document.getElementById("nouvelle").addEventListener("click", nouvelleConversation);

document.getElementById("deconnexion").addEventListener("click", async () => {
  await appel("/logout", {method: "POST"});
  location.href = "/login";
});

formulaire.addEventListener("submit", async (event) => {
  event.preventDefault();
  const texte = champ.value.trim();
  if (!texte) return;
  bulle("utilisateur").textContent = texte;
  champ.value = "";
  bouton.disabled = true;
  const attente = bulle("agent");
  attente.classList.add("reflexion");
  attente.innerHTML = `<span class="roue"></span><span>L'agent réfléchit…</span>`;
  defiler();
  try {
    const reponse = await appel("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: texte, conversation_id: conversationId}),
    });
    const corps = await reponse.json();
    const nouveau = corps.conversation_id && corps.conversation_id !== conversationId;
    conversationId = corps.conversation_id || conversationId;
    // L'agent lie une source au premier tour qui en demande une, et bascule
    // quand le message en nomme une autre : l'indicateur doit le montrer sans
    // qu'on ait à rouvrir le fil.
    afficherLaSource(corps.source_de_travail);
    rendreReponse(attente, corps.answer, corps.artifacts, corps.error);
    // 1er message : le fil vient d'être créé et titré côté serveur.
    if (nouveau) rafraichirFils();
  } catch (erreur) {
    attente.classList.remove("reflexion");
    attente.textContent = "Erreur réseau : " + erreur;
    attente.classList.add("erreur");
  } finally {
    bouton.disabled = false;
    champ.focus();
    defiler();
  }
});

// Le catalogue d'abord, la barre latérale ensuite — mais un catalogue
// illisible ne doit pas emporter la page avec lui : sans ce `catch`, une source
// injoignable au démarrage laisserait un chat sans aucune conversation listée.
// Le témoin dit « aucune » dès l'ouverture, avant même qu'un fil soit choisi :
// un bandeau vide se lirait comme un chargement qui n'en finit pas.
afficherLaSource("");
chargerLesSources().catch(() => {}).finally(() => { afficherLaSource(sourceLiee.dataset.nom || ""); rafraichirFils(); });
</script>
</body>
</html>
